# Fork maintenance: keep main rebased on the upstream project. Rewrites the fork's
# history (force-with-lease) whenever this fork carries its own commits.
name: sync-upstream
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Rebase main onto upstream and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/boadij/pi-herdsman.git
          git fetch upstream main
          git rebase upstream/main
          git push --force-with-lease origin HEAD:main
