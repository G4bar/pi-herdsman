# Fork maintenance: keep main a fast-forward mirror of the upstream project.
# Uses GitHub's merge-upstream API because GITHUB_TOKEN cannot push workflow-file
# changes. Fails (visible notification) if this fork ever carries its own commit on main.
name: sync-upstream
on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: sync-upstream
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Fast-forward main from upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/merge-upstream" -f branch=main --jq '.message'
